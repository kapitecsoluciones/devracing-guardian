<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardián de Javi</title>
<style>
  :root { --bg:#f6f4ee; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a64; --me:#1d1d1b; --meInk:#fff; --line:#e3e0d6; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --panel:#1f1f1d; --ink:#f0eee6; --muted:#9a988f; --me:#f0eee6; --meInk:#141413; --line:#2e2d2a; --accent:#fb923c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:10px; max-width:760px; width:100%; margin:0 auto; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:760px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--panel); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--me); color:var(--meInk); align-self:flex-end; border-bottom-right-radius:4px; }
  .typing { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:12px 16px 16px; max-width:760px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; font:inherit; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--ink); min-height:48px; max-height:160px; }
  button { font:inherit; font-weight:600; padding:0 18px; border-radius:14px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><h1>🛡️ Guardián</h1><span>de Javier Enriquez · Dev Racing Battle Royale</span></header>
<div id="log"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Escríbele al guardián…" autofocus></textarea>
  <button id="b">Enviar</button>
</form>
<script>
  const log = document.getElementById("log"), f = document.getElementById("f"), t = document.getElementById("t"), b = document.getElementById("b");
  const history = [];
  function add(cls, text) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
  add("bot", "Hola, soy el Guardián. Custodio un código secreto que no voy a soltar, pero platico de lo que quieras.");
  t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const message = t.value.trim(); if (!message) return;
    t.value = ""; b.disabled = true;
    add("me", message);
    const typing = add("bot typing", "escribiendo…");
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ history, message }) });
      const j = await r.json();
      typing.remove();
      add("bot", j.reply || "…");
      history.push({ role: "user", text: message }, { role: "assistant", text: j.reply, sig: j.sig });
    } catch { typing.textContent = "Se cayó la conexión. Intenta otra vez."; }
    b.disabled = false; t.focus();
  });
</script>
</body>
</html>
